; Android (docs/game1.md, "Android build and Google Play release"). Built by
; scripts/game1-android.sh with Godot 4.7.2 -- 4.3's Android libraries
; aren't 16 KB page aligned, which Google Play requires -- from a copy of
; this project, so the 4.3 Web export above is untouched. Signing keys come
; from the environment (GODOT_ANDROID_KEYSTORE_RELEASE_*), never this file.

[preset.1]

name="Android"
platform="Android"
runnable=false
dedicated_server=false
