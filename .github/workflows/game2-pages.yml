# game2 (docs/game2.md) demos are Godot HTML5 exports -- their .wasm
# files routinely exceed Cloudflare Workers' 25 MiB per-asset limit
# (Bounce Melody's is ~34 MiB), so they can't go out through the main
# site's own deploy (daily-deploy.yml / wrangler). GitHub Pages has no
# such per-file limit, and deploying here is completely independent of
# the real site: it publishes to this repo's own github.io project
# page, never the oraclecardoftheday.com custom domain, so this can
# never affect or break the live site or its daily deploy.
#
# Publishes one game2 demo folder as the Pages site's root (not the
# static/game2/ index) -- a demo's own asset references (index.js/.wasm/
# .pck) are already relative, so it just works served from any path,
# while static/game2/index.html's own links are absolute (/game2/...)
# and would break under a github.io project-page subpath. Pick a
# different demo by changing DEMO below.
#
# game1 (docs/game1.md) is exported the same way and rides along in the
# same Pages site under game1/<demo>/ -- again fine thanks to relative
# asset paths -- so adding it never moves the existing root URL. Further
# game2 demos (GAME2_DEMOS) ride along the same way under game2/<demo>/.
#
# Every push to main releases: the workflow exports each demo from its
# Godot source itself (Godot 4.3 + the nothreads Web templates, cached),
# so a commit that only changes game1/ or game2/ source still goes out.
# The exports committed under static/ are overwritten by the fresh ones
# on the runner; they stay in the repo as the last known-good build.

name: game1 + game2 Pages (large-asset demos)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  DEMO: bounce-melody
  GAME2_DEMOS: ragdoll-meme
  GAME1_DEMOS: rail-yard
  GODOT_VERSION: 4.3

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSLf -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # The full template archive is ~1 GB; keep only the Web
          # (nothreads) ones every preset here uses.
          curl -sSLf -o /tmp/tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tpl"
          unzip -q -j -o /tmp/tpl.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$tpl"
          rm /tmp/godot.zip /tmp/tpl.tpz
      - name: Export demos from source
        run: |
          set -o pipefail
          export_demo() { # <game folder> <demo>
            p="$1/$2"
            ~/godot/godot --headless --editor --quit --path "$p" > /dev/null 2>&1 || true
            ~/godot/godot --headless --path "$p" --export-release "Web" 2>&1 | tee "/tmp/export-$2.log"
            # A script parse error still exports with exit code 0 (the broken
            # script is just logged), so fail on any ERROR in the log.
            if grep -q "ERROR" "/tmp/export-$2.log"; then
              echo "::error::export of $p failed"; exit 1
            fi
            node scripts/game2-postexport.mjs "$2" "$1"
          }
          export_demo game2 "$DEMO"
          for d in ${GAME2_DEMOS}; do export_demo game2 "$d"; done
          for d in ${GAME1_DEMOS}; do export_demo game1 "$d"; done
      - uses: actions/configure-pages@v5
        with:
          # Pages has never been enabled for this repo -- configure-
          # pages defaults to enablement: false (check-only, fail if
          # missing), so the very first run needs this explicit true to
          # create the Pages site itself via the API. Harmless to leave
          # set on every later run too, once it exists.
          enablement: true
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r static/game2/${DEMO}/. _site/
          for d in ${GAME2_DEMOS}; do
            mkdir -p _site/game2/$d
            cp -r static/game2/$d/. _site/game2/$d/
          done
          for d in ${GAME1_DEMOS}; do
            mkdir -p _site/game1/$d
            cp -r static/game1/$d/. _site/game1/$d/
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
