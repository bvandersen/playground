# game2 (docs/game2.md) demos are Godot HTML5 exports -- their .wasm
# files routinely exceed Cloudflare Workers' 25 MiB per-asset limit
# (Bounce Melody's is ~34 MiB), so they can't go out through the main
# site's own deploy (daily-deploy.yml / wrangler). GitHub Pages has no
# such per-file limit, and deploying here is completely independent of
# the real site: it publishes to this repo's own github.io project
# page, never the oraclecardoftheday.com custom domain, so this can
# never affect or break the live site or its daily deploy.
#
# Publishes exactly one demo folder as the Pages site's root (not the
# static/game2/ index) -- a demo's own asset references (index.js/.wasm/
# .pck) are already relative, so it just works served from any path,
# while static/game2/index.html's own links are absolute (/game2/...)
# and would break under a github.io project-page subpath. Pick a
# different demo by changing DEMO below.

name: game2 Pages (large-asset demos)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'static/game2/bounce-melody/**'
      - '.github/workflows/game2-pages.yml'

env:
  DEMO: bounce-melody

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
        with:
          # Pages has never been enabled for this repo -- configure-
          # pages defaults to enablement: false (check-only, fail if
          # missing), so the very first run needs this explicit true to
          # create the Pages site itself via the API. Harmless to leave
          # set on every later run too, once it exists.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static/game2/${{ env.DEMO }}
      - id: deployment
        uses: actions/deploy-pages@v4
