# Builds Rail Yard (game1, docs/game1.md) for Android with
# scripts/game1-android.sh. Run it by hand from the Actions tab:
#   - apk: a debug build to sideload on a phone (adb install), no secrets
#   - aab: the signed release bundle to upload to Google Play; needs the
#     repo secrets ANDROID_UPLOAD_KEYSTORE_BASE64 (base64 of the .jks),
#     ANDROID_UPLOAD_KEY_ALIAS and ANDROID_UPLOAD_KEY_PASSWORD
# The build comes out as a workflow artifact. The version code is this
# workflow's run number (+ VERSION_CODE_BASE), so it always goes up.
# GitHub's Ubuntu runners already have the Android SDK and a JDK.

name: game1 Android build

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'apk (debug, sideload) or aab (signed release, Play)'
        type: choice
        options: [apk, aab]
        default: apk

permissions:
  contents: read

env:
  VERSION_CODE_BASE: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rail-yard-android
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-android
      - name: Upload key
        if: inputs.kind == 'aab'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build
        env:
          VERSION_CODE_RUN: ${{ github.run_number }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ inputs.kind == 'aab' && format('{0}/upload.jks', runner.temp) || '' }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$((VERSION_CODE_RUN + VERSION_CODE_BASE))
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          scripts/game1-android.sh "${{ inputs.kind }}"
      - name: Check 16 KB page alignment (required by Google Play)
        run: |
          f=build/game1-android/rail-yard.${{ inputs.kind }}
          mkdir -p /tmp/libs && unzip -o -q "$f" '*.so' -d /tmp/libs
          bad=0
          for so in $(find /tmp/libs -name '*.so' -path '*arm64*'); do
            a=$(readelf -lW "$so" | awk '/LOAD/ {print $NF; exit}')
            echo "$so: $a"
            [ $((a)) -ge 16384 ] || bad=1
          done
          [ $bad = 0 ] || { echo "::error::native libraries aren't 16 KB aligned"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: rail-yard-${{ inputs.kind }}-${{ github.run_number }}
          path: build/game1-android/rail-yard.${{ inputs.kind }}
          if-no-files-found: error
